[project]
name = "profile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.1.12",
    "pyjwt[crypto]>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

# Configure Django test discovery.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"

# Measure coverage over application and configuration code.
[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
]

# Enforce the project's minimum coverage requirement.
[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
